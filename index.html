<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CloverPit</title>

  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #111;

    #loading-text {
      color: white;

      font: 14px Arial, sans-serif;

      pointer-events: none;
    }
  </style>

<body>

  <div id="loading-text">
    LOADING... 0 MB
  </div>

  <div id="error"></div>

  <div id="unity-container">

    <canvas
      id="unity-canvas"
      width="960"
      height="540"
      tabindex="-1">
    </canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>

      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>

  </div>

  <div id="mouse-lock-message">
    Mouse locked — press ESC to unlock
  </div>


<script>
"use strict";


/* ==============================
   ELEMENTS
   ============================== */

const loadingText =
  document.getElementById("loading-text");

const errorBox =
  document.getElementById("error");

const canvas =
  document.getElementById("unity-canvas");

const loadingBar =
  document.getElementById("unity-loading-bar");

const progressBar =
  document.getElementById(
    "unity-progress-bar-full"
  );

const mouseLockMessage =
  document.getElementById(
    "mouse-lock-message"
  );


let loadedBytes = 0;


/* ==============================
   MOUSE LOCK
   ============================== */

// Click the game to lock the mouse
canvas.addEventListener("click", function () {

  if (document.pointerLockElement !== canvas) {

    canvas.requestPointerLock().catch(function (error) {

      console.log(
        "Mouse lock failed:",
        error
      );

    });

  }

});


// Detect mouse lock / unlock
document.addEventListener(
  "pointerlockchange",
  function () {

    if (
      document.pointerLockElement === canvas
    ) {

      console.log("Mouse locked");

      canvas.style.cursor = "none";

      mouseLockMessage.style.display =
        "block";

    } else {

      console.log("Mouse unlocked");

      canvas.style.cursor =
        "default";

      mouseLockMessage.style.display =
        "none";

    }

  }
);


// Detect pointer-lock errors
document.addEventListener(
  "pointerlockerror",
  function () {

    console.log(
      "Pointer Lock was blocked."
    );

  }
);


/* ==============================
   ERROR HANDLING
   ============================== */

function showError(message) {

  console.error(message);

  errorBox.style.display =
    "block";

  errorBox.textContent =
    "Clover Pit could not start.\n\n" +
    message +
    "\n\nCheck that the complete Build folder was uploaded to GitHub Pages.";

  loadingText.textContent =
    "ERROR";
}


/* ==============================
   DOWNLOAD BUILD PART
   ============================== */

async function fetchPart(url) {

  const response =
    await fetch(
      url,
      {
        cache: "no-cache"
      }
    );


  if (!response.ok) {

    throw new Error(
      "Could not load " +
      url +
      " (HTTP " +
      response.status +
      ")"
    );

  }


  if (!response.body) {

    throw new Error(
      "The browser could not read the response body for " +
      url
    );

  }


  const reader =
    response.body.getReader();


  const chunks = [];

  let size = 0;


  while (true) {

    const {
      done,
      value
    } = await reader.read();


    if (done) break;


    chunks.push(value);

    size += value.length;

    loadedBytes += value.length;


    loadingText.textContent =
      "LOADING... " +
      (
        loadedBytes /
        1048576
      ).toFixed(1) +
      " MB";

  }


  const result =
    new Uint8Array(size);


  let offset = 0;


  for (const chunk of chunks) {

    result.set(
      chunk,
      offset
    );

    offset += chunk.length;

  }


  return result;
}


/* ==============================
   MERGE BUILD PARTS
   ============================== */

async function mergeParts(
  baseName,
  partCount
) {

  const parts = [];


  for (
    let i = 1;
    i <= partCount;
    i++
  ) {

    parts.push(
      await fetchPart(
        "Build/" +
        baseName +
        ".part" +
        i
      )
    );

  }


  const total =
    parts.reduce(
      (sum, part) =>
        sum +
        part.byteLength,
      0
    );


  const merged =
    new Uint8Array(total);


  let offset = 0;


  for (const part of parts) {

    merged.set(
      part,
      offset
    );

    offset +=
      part.byteLength;

  }


  return URL.createObjectURL(
    new Blob([merged])
  );
}


/* ==============================
   START UNITY GAME
   ============================== */

async function startGame() {

  try {

    loadingBar.style.display =
      "block";


    // Load the three data parts
    const dataUrl =
      await mergeParts(
        "CloverPit.data",
        3
      );


    // Load the three WASM parts
    const wasmUrl =
      await mergeParts(
        "CloverPit.wasm",
        3
      );


    loadingText.textContent =
      "STARTING GAME...";


    const config = {

      arguments: [],

      dataUrl:
        dataUrl,

      frameworkUrl:
        "Build/CloverPit.framework.js",

      codeUrl:
        wasmUrl,

      streamingAssetsUrl:
        "StreamingAssets",

      companyName:
        "Panik Arcade",

      productName:
        "CloverPit",

      productVersion:
        "1.3",

      showBanner:
        function () {}

    };


    const script =
      document.createElement(
        "script"
      );


    script.src =
      "Build/CloverPit.loader.js";


    script.onload =
      function () {

        createUnityInstance(
          canvas,
          config,
          function (progress) {

            progressBar.style.width =
              (
                progress * 100
              ) +
              "%";


            loadingText.textContent =
              "STARTING GAME... " +
              Math.round(
                progress * 100
              ) +
              "%";

          }

        )
        .then(function () {

          loadingBar.style.display =
            "none";

          loadingText.style.display =
            "none";

        })
        .catch(function (err) {

          showError(
            err &&
            err.message
              ? err.message
              : String(err)
          );

        });

      };


    script.onerror =
      function () {

        showError(
          "Build/CloverPit.loader.js could not be loaded."
        );

      };


    document.body.appendChild(
      script
    );


  } catch (err) {

    showError(
      err &&
      err.message
        ? err.message
        : String(err)
    );

  }

}


/* ==============================
   START
   ============================== */

startGame();

</script>

</body>
</html>
